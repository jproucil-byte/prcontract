name: "PR contract"
description: "Verify that a pull request meets the project's contribution contract. Deterministic: no LLM, no AI detection, never executes PR code."
author: "prcontract contributors"
branding:
  icon: "check-circle"
  color: "green"

inputs:
  config:
    description: "Path to the config file, relative to the checked-out repository."
    default: ".prcontract.toml"
  comment:
    description: "Post or update a single sticky comment on the pull request (needs pull-requests: write)."
    default: "true"
  fail-on:
    description: "When to fail the job: error, warn or never."
    default: "error"
  github-token:
    description: "Token used to read the pull request and post the comment."
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install prcontract
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --quiet "$ACTION_PATH"

    - name: Check the pull request
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PRC_CONFIG: ${{ inputs.config }}
        PRC_COMMENT: ${{ inputs.comment }}
        PRC_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        args=(check --github --fail-on "$PRC_FAIL_ON")
        if [ -f "$PRC_CONFIG" ]; then args+=(--config "$PRC_CONFIG"); fi
        if [ "$PRC_COMMENT" = "true" ]; then args+=(--comment); fi
        prcontract "${args[@]}"
